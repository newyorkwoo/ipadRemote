name: iPadRemote
options:
  bundleIdPrefix: com.steven.ipadremote
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9K7YW349U4"   # Apple Developer Team ID

targets:
  iPadRemote:
    type: application
    platform: iOS
    sources:
      - path: iPadRemote
      - path: Shared
    info:
      path: iPadRemote/Info.plist
      properties:
        CFBundleDisplayName: 遠端 Mac
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        # 讓實體滑鼠 / 觸控板以 indirectPointer 回報（可分辨左右鍵、按住拖曳），而不是被當成手指
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 需要存取區域網路以尋找並連線到你的 Mac，以及送出喚醒封包。
        NSFaceIDUsageDescription: 使用 Face ID 解鎖 App，避免別人用你的 iPad 控制 Mac。
        NSBonjourServices:
          - _ipadremote._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steven.ipadremote.client
        TARGETED_DEVICE_FAMILY: "2"
        # 取得 Apple 核准的 multicast entitlement 後，取消下一行註解即可在區網送出廣播喚醒封包
        # CODE_SIGN_ENTITLEMENTS: iPadRemote/iPadRemote.entitlements

  MacAgent:
    type: application
    platform: macOS
    sources:
      - path: MacAgent
      - path: Shared
    info:
      path: MacAgent/Info.plist
      properties:
        CFBundleDisplayName: iPad Remote Agent
        CFBundleName: iPad Remote Agent
        LSUIElement: true
        NSLocalNetworkUsageDescription: 需要存取區域網路，讓你的 iPad 能找到並連線到這台 Mac。
        NSBonjourServices:
          - _ipadremote._tcp
    entitlements:
      path: MacAgent/MacAgent.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steven.ipadremote.agent
        PRODUCT_NAME: iPad Remote Agent
        ENABLE_HARDENED_RUNTIME: YES

  # ───────── 自動化測試 ─────────
  MacCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacCoreTests
      - path: Shared
      - path: MacAgent
        excludes:
          - MacAgentApp.swift
          - AgentController.swift
          - "*.plist"
          - "*.entitlements"
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steven.ipadremote.maccoretests
        GENERATE_INFOPLIST_FILE: YES

  iPadRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iPadRemoteTests
    dependencies:
      - target: iPadRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steven.ipadremote.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iPadRemote.app/iPadRemote"
        BUNDLE_LOADER: "$(TEST_HOST)"

  iPadRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/iPadRemoteUITests
    dependencies:
      - target: iPadRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steven.ipadremote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: iPadRemote

schemes:
  MacCoreTests:
    build:
      targets:
        MacCoreTests: [test]
    test:
      targets: [MacCoreTests]
  iPadRemote:
    build:
      targets:
        iPadRemote: all
    run:
      config: Debug
    test:
      targets: [iPadRemoteTests, iPadRemoteUITests]
  MacAgent:
    build:
      targets:
        MacAgent: all
